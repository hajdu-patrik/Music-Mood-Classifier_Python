{% extends 'base.html' %}
{% block content %}
    <div class="container">
        <h1>🎶 Music Classifier</h1>
        <form action="/search" method="GET">
            <div class="form-group">
                <label for="artist" class="form-label">Artist:</label>
                <input type="text" id="artist" name="artist" class="form-control" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="song" class="form-label">Song title:</label>
                <input type="text" id="song" name="song" class="form-control" required autocomplete="off">
            </div>
            {{ ui.submit_button('Search for recommendations') }}
        </form>
    </div>
{% endblock %}
